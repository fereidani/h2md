[package]
name = "h2md"
version = "0.3.0"
edition = "2024"
description = "HTML to Markdown converter powered by a browser-grade HTML parser"
license = "MIT"
repository = "https://github.com/fereidani/h2md"
homepage = "https://github.com/fereidani/h2md"
documentation = "https://docs.rs/h2md"
readme = "README.md"
keywords = ["html", "markdown", "converter", "html5ever"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
html5ever = "0.39.0"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
debug = 0
lto = 'fat'
panic = 'abort'
codegen-units = 1
rpath = false
strip = true
